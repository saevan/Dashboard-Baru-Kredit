<!DOCTYPE html>
<html lang="id">

<head>

     <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

     <title>MEZS.id Sederhana</title>
     <meta name="claude:viewport-fit-sides" content="cover" />

               <button type="button" data-mode="lengkap" aria-pressed="false">Lengkap</button>
          </div>

     <main id="app" aria-live="polite"></main>

     <footer class="footer">Perhitungan memakai mesin MEZS.id yang sama (skor 6 pilar, aturan kebijakan, PD/LGD, stress test). Kasus demo fiktif.</footer>

     <noscript>

     <script type="module">
